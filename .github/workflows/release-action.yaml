name: Release Action

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Puma Scan Pro release build ID (e.g., #.#.#.##)"
        required: true
        type: string
      image-tag:
        description: "Puma Scan Pro container image tag (e.g., #.#.#-net10-linux-x64)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: generate app token
        id: app-token
        uses: actions/create-github-app-token@7bd03711494f032dfa3be3558f7dc8787b0be333 # v3.1.0
        with:
          client-id: ${{ secrets.PUMA_SCAN_PRO_BOT_APP_ID }}
          private-key: ${{ secrets.PUMA_SCAN_PRO_BOT_APP_SECRET }}
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # zizmor: ignore[artipacked] credentials needed for git push
          token: ${{ steps.app-token.outputs.token }}

      - name: Update Dockerfile container image
        env:
          IMAGE_TAG: ${{ inputs['image-tag'] }}
        run: ./build/update-container-image.sh "${IMAGE_TAG}"

      - name: commit version
        env:
          PUMA_BUILD_ID: ${{ inputs['build_id'] }}
          IMAGE_TAG: ${{ inputs['image-tag'] }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config --local user.email "${APP_SLUG}@pumasecurity.io"
          git config --local user.name "${APP_SLUG}"
          git add Dockerfile
          if git diff --cached --quiet; then
            echo "No Dockerfile changes to commit"
          else
            git commit -m "chore: release ${IMAGE_TAG} (build ${PUMA_BUILD_ID})"
            git push
          fi

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_ID: ${{ inputs.build_id }}
          IMAGE_TAG: ${{ inputs['image-tag'] }}
        run: |
          GENERATED_NOTES=$(gh api \
            --method POST \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${BUILD_ID}" \
            --jq .body)

          gh release create "v${BUILD_ID}" \
            --title "v${BUILD_ID}" \
            --notes "Puma scan image tag: ${IMAGE_TAG}

          ${GENERATED_NOTES}"
